include: package:yumemi_lints/flutter/3.44/recommended.yaml

plugins:
  riverpod_lint:
    version: 3.1.9
    diagnostics:
      # ViewModel から BuildContext を渡す既存実装を許容する
      # ゆくゆくは許容できないようにしたい
      avoid_build_context_in_providers: false

analyzer:
  errors: # https://pub.dev/packages/freezed#install
    invalid_annotation_target: ignore
    avoid_dynamic_calls: ignore
  exclude:
    - lib/gen/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:

    # ウィジェットのデバッグ情報が不足している場合の警告
    diagnostic_describe_all_properties: false

    # asyncに関する警告
    discarded_futures: false

    # BuildContextに関する警告
    use_build_context_synchronously: false
    
    # nullに関する警告
    unreachable_from_main: false

    # 公開APIの型注釈（type_annotate_public_apis）と衝突するため無効化
    omit_obvious_property_types: false

    # ジェネリックなコールバック型で誤検知しやすいため無効化
    unsafe_variance: false
